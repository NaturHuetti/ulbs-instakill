spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/instakill}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:instakill}
    password: ${DB_PASSWORD:instakill_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
server:
  servlet:
    context-path: /
springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger
management:
  endpoints:
    web:
      exposure:
        include: health,info
media:
  base-path: media
instakill:
  jwt:
    secret: change-me-change-me-change-me-change-me-change-me-secret-key-1234
    issuer: instakill
    ttl-minutes: 120
  ntfy:
    enabled: true
    base-url: https://ntfy.sh
    topic: ${NTFY_TOPIC:instakill-demo}
logging:
  level:
    org.hibernate.SQL: warn
